# Edge vhost del joc — preguntes.ddns.net -> contenidor preguntes-ciencia (127.0.0.1:8092).
# Comença només amb HTTP; `certbot --nginx -d preguntes.ddns.net` hi afegeix el
# bloc 443 i la redirecció HTTP->HTTPS automàticament.
server {
    listen 80;
    listen [::]:80;
    server_name preguntes.ddns.net;

    client_max_body_size 1M;

    # Opcional: protegir el joc amb usuari i contrasenya (vegeu deploy/README).
    # auth_basic           "Ciència a la URV";
    # auth_basic_user_file /etc/nginx/preguntes.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:8092;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
